# Пример для /etc/nginx/sites-available/bigwinzone
# Важно: URL уведомлений ЮMoney — только https:// (не http://), иначе POST потеряется при редиректе.

server {
    listen 80;
    server_name bigwinzone.ru www.bigwinzone.ru;
    return 301 https://bigwinzone.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bigwinzone.ru;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2m;
    }
}
