<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f1a">
  <title>New Slot — WIP</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="slot-app">
    <header class="slot-header">
      <p class="slot-eyebrow">Work in progress</p>
      <h1 class="slot-title">New Slot</h1>
      <p class="slot-sub">Серверный баланс подключён. Правила игры — позже.</p>
    </header>

    <section class="slot-stage" aria-label="Игровое поле">
      <div class="reels" id="reels" aria-hidden="true">
        <div class="reel" data-reel="0"><span>?</span></div>
        <div class="reel" data-reel="1"><span>?</span></div>
        <div class="reel" data-reel="2"><span>?</span></div>
      </div>
      <p class="status-line" id="statusLine">Нажмите SPIN</p>
    </section>

    <section class="slot-hud">
      <div class="hud-item">
        <span class="hud-label">Баланс</span>
        <span class="hud-value" id="balanceValue">0.00</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Ставка</span>
        <span class="hud-value" id="betValue">1.00</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Выигрыш</span>
        <span class="hud-value" id="winValue">0.00</span>
      </div>
    </section>

    <div class="slot-controls">
      <button type="button" class="ctrl-btn" id="betDown" aria-label="Уменьшить ставку">−</button>
      <button type="button" class="spin-btn" id="spinBtn">SPIN</button>
      <button type="button" class="ctrl-btn" id="betUp" aria-label="Увеличить ставку">+</button>
    </div>
  </div>

  <script>
    window.SLOT_GAME_ID = "newslot";
    window.SLOT_GAME_TITLE = "New Slot";
  </script>
  <script src="../shared/casino-wallet.js"></script>
  <script src="slot.js"></script>
</body>
</html>
